{% set name = "dlint" %}
{% set version = "0.17.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/dlint-py/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: d693bfe5e28b7ffb9906f3133a00ca1eea1d46208a640fecb4e7e70944be7e9d

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - poetry-core
  run:
    - flake8 >=3.6.0
    - python >={{ python_min }}

test:
  imports:
    - dlint
  requires:
    - flake8
    - m2-grep  # [win]
    - pip
    - python {{ python_min }}
  commands:
    - pip check
    - flake8 --version | grep dlint

about:
  home: https://github.com/dlint-py/dlint
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Flake8 expention for encouraging best and secure coding practices.
  doc_url: https://github.com/dlint-py/dlint/tree/master/docs

extra:
  recipe-maintainers:
    - thewchan
